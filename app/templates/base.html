<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllLink フロー管理</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header>
    <div class="container">
        <div class="topbar">
            <h1 class="logo">AllLink <span>Flow Hub</span></h1>
            <nav>
                <a href="/">アップロード</a>
                <a href="/submissions">申請一覧</a>
                <a href="/approvals">承認</a>
                <a href="/flows">フロー管理</a>
                <span class="nav-actions">
                    {% if user %}
                        <span>ログイン中: {{ user.full_name }} ({{ user.role }})</span>
                        {% if user.role == 'admin' %}
                            <a href="/auth/register">ユーザー登録</a>
                        {% endif %}
                        <form action="/auth/logout" method="post">
                            <button type="submit">ログアウト</button>
                        </form>
                    {% else %}
                        <a href="/auth/login">ログイン</a>
                    {% endif %}
                </span>
            </nav>
        </div>
    </div>
</header>
<main class="container">
    {% block content %}{% endblock %}
</main>
<footer>
    <div class="container">
        <p>ローカル環境で利用する簡易システムです。</p>
    </div>
</footer>
</body>
</html>
